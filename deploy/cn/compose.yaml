name: gofurry-cn

x-runtime: &runtime
  pull_policy: never
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  logging:
    driver: local
    options: {max-size: '10m', max-file: '3', compress: 'true'}

x-api: &api
  <<: *runtime
  image: ${GOFURRY_API_IMAGE:?select the GoFurry API image}
  volumes:
    - type: bind
      source: ${CN_CONFIG_DIR:?select an external config directory}/gofurry
      target: /etc/gofurry
      read_only: true
      bind: {create_host_path: false}
  mem_limit: 256m
  cpus: 0.75

x-admin: &admin
  <<: *runtime
  image: ${ADMIN_IMAGE:-librecosta-admin:unconfigured}
  volumes:
    - type: bind
      source: ${CN_CONFIG_DIR}/admin
      target: /run/admin
      read_only: true
      bind: {create_host_path: false}
  mem_limit: 384m
  cpus: 0.75

services:
  edge:
    <<: *runtime
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    networks:
      default: {gw_priority: 1}
      backend: {}
    ports:
      - '127.0.0.1:${CN_HTTPS_PORT:-18443}:8443'
      - '127.0.0.1:${CN_ADMIN_PORT:-18444}:9443'
    volumes:
      - type: bind
        source: ${CN_CONFIG_DIR}/nginx
        target: /run/edge
        read_only: true
        bind: {create_host_path: false}
      - ./proxy-headers.conf:/etc/nginx/proxy-gofurry.conf:ro
    command: [-c, /run/edge/nginx.conf]
    tmpfs: ['/tmp:size=16m,mode=1777']
    healthcheck:
      test: [CMD-SHELL, 'wget -qO /dev/null http://127.0.0.1:8081/readyz && wget -qO /dev/null http://127.0.0.1:8080/readyz']
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 3
    mem_limit: 96m
    cpus: 0.25
  api:
    <<: *api
    network_mode: service:edge
    depends_on:
      edge: {condition: service_started, restart: true}
  web:
    <<: *runtime
    image: ${GOFURRY_WEB_IMAGE:?select the GoFurry SSR image}
    depends_on:
      api: {condition: service_healthy, restart: true}
    environment:
      WEB_REGION: CN
      WEB_API_BASE_URL: http://edge:8080
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?set the exact CN HTTPS origin}
      NODE_OPTIONS: --max-old-space-size=320
    tmpfs: ['/tmp:size=16m,mode=1777']
    mem_limit: 512m
    cpus: 1
  admin:
    <<: *admin
    profiles: [ops]
    network_mode: service:edge
    depends_on:
      api: {condition: service_healthy, restart: true}
  api-maintenance:
    <<: *api
    profiles: [maintenance]
    restart: 'no'
    healthcheck: {disable: true}
    networks: [backend]
    command: [migrate, status, --config, /run/maintenance.yaml]
  admin-maintenance:
    <<: *admin
    profiles: [maintenance]
    restart: 'no'
    healthcheck: {disable: true}
    networks: [backend]
    command: [migrate, status, --dir, /app/migrations, --config, /run/maintenance.yaml]

networks:
  backend:
    name: librecosta-backend
    external: true

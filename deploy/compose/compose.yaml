name: gofurry-local

x-logging: &logging
  driver: local
  options:
    max-size: '5m'
    max-file: '3'
    compress: 'true'

services:
  web:
    image: gofurry-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-17320}:3000'
    environment:
      NODE_ENV: production
      WEB_REGION: ${WEB_REGION:-CN}
      WEB_API_BASE_URL: http://api:8080
    logging: *logging
    stop_grace_period: 20s
  api:
    image: gofurry-api:local
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-17321}:8080'
    volumes:
      - type: bind
        source: ${API_CONFIG_FILE:-./config.yaml}
        target: /etc/gofurry/config.yaml
        read_only: true
        bind:
          create_host_path: false
    logging: *logging
    stop_grace_period: 20s

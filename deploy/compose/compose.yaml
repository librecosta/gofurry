name: gofurry-local

x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  web:
    image: gofurry-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
    logging: *logging
    stop_grace_period: 20s
  api:
    image: gofurry-api:local
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    environment:
      APP_ENV: production
      API_ADDR: 0.0.0.0:8080
    logging: *logging
    stop_grace_period: 20s

name: gofurry

x-logging: &logging
  driver: local
  options:
    max-size: '5m'
    max-file: '3'
    compress: 'true'

services:
  web:
    image: ${GOFURRY_WEB_IMAGE:-gofurry-web:local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-17320}:3000'
    environment:
      GOFURRY_WEB_CONFIG_FILE: /etc/gofurry/web.yaml
    volumes:
      - type: bind
        source: ${WEB_CONFIG_FILE:-./web.yaml}
        target: /etc/gofurry/web.yaml
        read_only: true
        bind:
          create_host_path: false
    logging: *logging
    stop_grace_period: 20s

  api:
    image: ${GOFURRY_API_IMAGE:-gofurry-api:local}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    ports:
      - '127.0.0.1:${API_PORT:-17321}:8080'
    networks:
      default:
        aliases: [gofurry-api]
        gw_priority: 1
      backend: {}
    volumes:
      - type: bind
        source: ${API_CONFIG_FILE:-./config.yaml}
        target: /etc/gofurry/config.yaml
        read_only: true
        bind:
          create_host_path: false
    logging: *logging
    stop_grace_period: 20s

  admin:
    profiles: [ops]
    image: ${ADMIN_IMAGE:-librecosta-admin:local}
    ports:
      - '127.0.0.1:${ADMIN_PORT:-8082}:8082'
    networks:
      default: {gw_priority: 1}
      backend: {}
    volumes:
      - type: bind
        source: ${ADMIN_CONFIG_FILE:-./admin.yaml}
        target: /run/admin/config.yaml
        read_only: true
        bind:
          create_host_path: false
    logging: *logging
    stop_grace_period: 20s

networks:
  backend:
    name: librecosta-backend
    external: true

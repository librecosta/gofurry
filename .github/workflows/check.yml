name: Foundation checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: librecosta/harvest
          ref: 349730b5c3ff57be084dfac72dfb77f19dacb54c
          path: .local/harvest-fixture
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            .local/harvest-fixture/go.sum
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'
      - run: task check:collection HARVEST_SOURCE="${{ github.workspace }}/.local/harvest-fixture"
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; reads packageManager
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'
      - run: task install
      - name: Install and verify Playwright Chromium
        shell: bash
        run: |
          pnpm --filter @gofurry/web exec playwright install chromium
          launch_chromium() {
            pnpm --filter @gofurry/web exec node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close()'
          }
          if ! launch_chromium; then
            pnpm --filter @gofurry/web exec playwright install-deps chromium
            launch_chromium
          fi
      - run: task check:build
      - run: task sql:check
      - run: task check:catalog
      - run: task check:web
      - run: pnpm --filter @gofurry/web exec playwright test governance.spec.ts start.spec.ts
        env:
          WEB_REGION: INTL
      - run: task check:hmr
      - run: task check:docker
      - run: task check:containers

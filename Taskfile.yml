version: '3'

env:
  GOTOOLCHAIN: go1.27.3

vars:
  CONFIG: '{{.ROOT_DIR}}/config.yaml'

tasks:
  tools:
    desc: Verify pinned runtime and package manager versions
    cmds:
      - pnpm exec node scripts/check-toolchains.mjs
  install:
    cmds:
      - pnpm install --frozen-lockfile
      - go -C services/api mod download
  dev:web:
    cmds:
      - pnpm --filter @gofurry/web dev
  dev:api:
    dir: services/api
    cmds:
      - go run ./cmd/api --config "{{.CONFIG}}"
  stop:
    desc: Stop this checkout's local Web and API on ports 17320/17321
    cmds:
      - pnpm exec node scripts/stop-dev.mjs
  stop:web:
    desc: Stop this checkout's local Web on port 17320
    cmds:
      - pnpm exec node scripts/stop-dev.mjs web
  stop:api:
    desc: Stop this checkout's local API on port 17321
    cmds:
      - pnpm exec node scripts/stop-dev.mjs api
  cities:init:
    desc: Download a manual GeoNames snapshot and build the ignored weather city catalog (Python 3.10+)
    cmds:
      - python scripts/init-geonames.py
  migrate:
    vars:
      ACTION: '{{default "status" .ACTION}}'
    cmds:
      - go -C services/api run ./cmd/api migrate {{.ACTION}} --config "{{.CONFIG}}" --dir "{{.ROOT_DIR}}/services/api/migrations"
  sql:generate:
    dir: services/api
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
  sql:check:
    dir: services/api
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
  check:catalog:
    desc: Verify Site, Game, Yearbook and both regional Navigation pages with disposable PostgreSQL 18 and Redis 8
    cmds:
      - node scripts/check-catalog.mjs
  check:collection:
    desc: Verify GoFurry and pinned Harvest V0.1-D against separate disposable PostgreSQL 18 databases
    vars:
      HARVEST_SOURCE: '{{default (print .ROOT_DIR "/../harvest") .HARVEST_SOURCE}}'
    cmds:
      - go -C services/api test -tags=integration ./internal/collection -run '^Test(CollectionHarvestD|GameIntakeHarvestD|GameIntakeAdmission)$' -count=1 -timeout=8m -v -args -harvest-source "{{.HARVEST_SOURCE}}"
  check:wallpapers:
    cmds:
      - go -C services/api test ./internal/wallpaper ./internal/management ./internal/storage ./internal/platform
  check:wallpapers:db:
    desc: Reset only an explicitly configured owned gofurry_c2_*_test database; storage is simulated
    cmds:
      - go -C services/api test -count=1 -tags=integration ./internal/wallpaper -args -wallpaper-config "{{.CONFIG}}"
  check:wallpapers:storage:
    desc: Real isolated development storage and native management acceptance; stop other test instances first
    requires:
      vars: [BUCKET, PUBLIC_BASE]
    cmds:
      - go -C services/api test -count=1 -tags=integration ./internal/wallpaper -args -wallpaper-config "{{.CONFIG}}" -development-bucket "{{.BUCKET}}" -development-public-base "{{.PUBLIC_BASE}}"
      - go -C services/api test -count=1 -tags=integration ./internal/server -run '^TestManagementRealDevelopmentHTTP$' -args -wallpaper-runtime-config "{{.CONFIG}}" -development-bucket "{{.BUCKET}}" -development-public-base "{{.PUBLIC_BASE}}"
  check:wallpapers:schema:
    desc: Explicit migration acceptance on an owned gofurry_c2_*_empty_test database
    cmds:
      - go -C services/api test -count=1 -tags=integration ./internal/database -args -empty-wallpaper-config "{{.CONFIG}}"
  check:wallpapers:link:
    desc: Read-only audit correlation against an explicit C3 browser observation
    requires:
      vars: [OBSERVATION]
    cmds:
      - go -C services/api test -count=1 -tags=integration ./internal/wallpaper -run '^TestC3CrossServiceAudit$' -args -wallpaper-config "{{.CONFIG}}" -c3-observation "{{.OBSERVATION}}"
  wallpaper:import:
    requires:
      vars: [BUCKET, PUBLIC_BASE]
    vars:
      INPUT: '{{default (print .ROOT_DIR "/services/api/internal/handlers/backgrounds.json") .INPUT}}'
      REVIEWED: '{{default "false" .REVIEWED}}'
    cmds:
      - go -C services/api run ./cmd/api wallpaper-import "{{.INPUT}}" --config "{{.CONFIG}}" --development-bucket "{{.BUCKET}}" --development-public-base "{{.PUBLIC_BASE}}" --confirm-reviewed-sfw={{.REVIEWED}}
  check:
    desc: Verify toolchains, Go formatting/vet/tests/build, Web build/types and browser smoke tests
    cmds:
      - task: check:build
      - task: check:web
  check:build:
    cmds:
      - task: tools
      - pnpm exec node scripts/check-go-format.mjs
      - task: check:api
      - task: build:web
      - pnpm --filter @gofurry/web typecheck
  check:web:
    cmds:
      - pnpm --filter @gofurry/web test:e2e
  check:api:
    dir: services/api
    cmds:
      - go vet ./...
      - go test ./...
      - go build -o ../../bin/api{{exeExt}} ./cmd/api
  build:web:
    cmds:
      - pnpm --filter @gofurry/web build
  check:hmr:
    desc: Verify SCSS Modules HMR and React Fast Refresh in the dev server
    cmds:
      - pnpm --filter @gofurry/web test:hmr
  check:docker:
    desc: Validate Compose and build independent local images (does not start services)
    cmds:
      - docker compose -f deploy/compose/compose.yaml config --quiet
      - docker compose -f deploy/compose/compose.yaml build
  check:containers:
    desc: Smoke-test prebuilt images on random ports in an isolated disposable Compose project
    cmds:
      - pnpm exec node scripts/check-containers.mjs

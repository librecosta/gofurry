version: '2'
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/database/queries
    gen:
      go:
        package: dbgen
        out: internal/database/dbgen
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type: { import: uuid, type: UUID }
          - db_type: uuid
            nullable: true
            go_type: { import: uuid, type: UUID, pointer: true }

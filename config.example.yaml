server:
  address: 127.0.0.1:17321
  environment: development
  # Empty by default. List only your actual proxy peer IPs/CIDRs, never 0.0.0.0/0.
  trusted_proxies: []
deployment:
  region: CN
logging:
  slow_request: 1s

# Optional local DB-IP Lite City. Relative to this YAML file; blank disables.
geoip:
  database_path: ""
# database_path: data/geoip/dbip-city-lite-2026-11.mmdb

# Optional current weather. Host is the dedicated hostname, without https://.
# All file paths are relative to this YAML. No environment proxy/credential lookup.
qweather:
  enabled: false
  api_host: ""
  developer_id: ""
  project_id: ""
  credential_id: ""
  private_key_path: data/private/qweather/gofurry-dev-private.pem
  proxy_url: ""

# Explicit opt-in. Blank proxy_url means direct access (no HTTP_PROXY lookup).
# CN requires exact reviewed phrases; disable if no reliable review is available.
# INTL uses the conservative SFW filter; no NSFW mode is implemented.
search_suggestions:
  enabled: false
  proxy_url: ""
  cn_allowlist: []

# Optional S3-compatible public assets. null keeps the theme-only fallback.
# Set the complete mapping in private config.yaml; do not use environment keys.
storage: null
# storage:
#   endpoint: https://<account-id>.r2.cloudflarestorage.com
#   region: auto
#   bucket: <development-bucket>
#   access_key_id: <private>
#   secret_access_key: <private>
#   public_base_url: https://<verified-development-cdn>

server:
  address: 127.0.0.1:17321
  environment: development
  # Empty by default. List only your actual proxy peer IPs/CIDRs, never 0.0.0.0/0.
  trusted_proxies: []
deployment:
  region: CN
logging:
  slow_request: 1s

# Optional local DB-IP Lite City. Relative to this YAML file; blank disables.
geoip:
  database_path: ""
# database_path: data/geoip/dbip-city-lite-2026-11.mmdb

# Optional manual weather cities. Initialize with task cities:init; relative to YAML.
cities:
  index_path: ""
# index_path: data/cities/cities.json

# Optional current weather. Host is the dedicated hostname, without https://.
# All file paths are relative to this YAML. No environment proxy/credential lookup.
qweather:
  enabled: false
  api_host: ""
  developer_id: ""
  project_id: ""
  credential_id: ""
  private_key_path: data/private/qweather/gofurry-dev-private.pem
  proxy_url: ""

# Enabled by default in both regions. An explicit false disables suggestions.
# Blank proxy_url means direct access, never HTTP_PROXY discovery.
search_suggestions:
  enabled: true
  proxy_url: ""

# Existing regional Redis, optional local fallback if blank/unavailable.
# Username is only needed for ACL authentication. Credentials stay in private YAML.
redis:
  address: ""
  username: ""
  password: ""
  db: 0

# Optional S3-compatible public assets. null keeps the theme-only fallback.
# Set the complete mapping in private config.yaml; do not use environment keys.
storage: null
# storage:
#   endpoint: https://<account-id>.r2.cloudflarestorage.com
#   region: auto
#   bucket: <development-bucket>
#   access_key_id: <private>
#   secret_access_key: <private>
#   public_base_url: https://<verified-development-cdn>

# Optional, independent for every CN/INTL deployment. No static catalog fallback.
database: null
# database:
#   host: 127.0.0.1
#   port: 5432
#   name: gofurry_cn
#   user: gofurry_cn
#   password: ""
#   ssl_mode: disable
#   connect_timeout: 3s
#   max_connections: 5
#   min_connections: 0
#   max_connection_lifetime: 30m
#   max_connection_idle_time: 5m

# Disabled unless complete. Generate 32 crypto/rand bytes as unpadded base64url.
# Token goes only in private YAML. Storage and database are required.
management: null
# management:
#   address: 127.0.0.1:17324
#   token: <private-random-32-byte-base64url>
